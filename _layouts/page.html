---
layout: default
---
<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</section>
<div class="container {% if page.wide %}content-wide{% else %}content{% endif %}">
  <article class="prose">
    {{ content }}
  </article>
</div>
