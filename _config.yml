#
# Site settings — Fischer Law, P.C.
#

name: "Fischer Law, P.C."
description: "Privacy, Cybersecurity, AI, and Technology Law"
tagline: "Outside counsel for privacy, cybersecurity, AI, and technology law."

# Used for the sitemap, feed, canonical links, and social share previews
url: "https://jordanfischerlaw.com"
baseurl: ""

# Default image for LinkedIn / social previews (1200 x 630)
og_image: "/images/og-default.png"

# Logo shown in the header
logo: "/images/Fischer Law Logo High Res cropped.png"

# Contact details used in the header, footer, and contact sections
contact:
  email: "info@jordanfischerlaw.com"
  phone: "267-536-9376"
  linkedin: "https://www.linkedin.com/in/jordan-fischer-cipp-e-cipp-us-cipm-706b4147"

# Leave blank unless you add analytics (update the Privacy Policy if you do)
google_analytics:

#
# Build settings — no need to change below this line
#

permalink: /:title/

collections:
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "bio"

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - "*.DS_Store"
